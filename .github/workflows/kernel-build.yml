name: Build Android Kernel ARM64

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: 'Kernel Defconfig'
        required: true
        default: 'sprd_qogirl6_defconfig'
        type: choice
        options:
          - sprd_qogirl6_defconfig
          - sprd_sharkl5Pro_defconfig
      build_target:
        description: 'Target to build (e.g. Image, Image.gz)'
        required: false
        default: 'Image Image.gz'
        type: string
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'README.md'
      - '.gitignore'
      - 'docs/**'
jobs:
  build:
    name: Build Kernel ARM64
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    env:
      ARCH: arm64
      KBUILD_BUILD_USER: NevaCPS
      KBUILD_BUILD_HOST: GitHubActions
      KERNEL_DIR: bsp/kernel/kernel5.4
      OUT_DIR: ${{ github.workspace }}/out
      NEUTRON_DIR: ${{ github.workspace }}/toolchain/neutron-clang
      DEFCONFIG: ${{ inputs.defconfig || 'sprd_qogirl6_defconfig' }}
      BUILD_TARGET: ${{ inputs.build_target || 'Image Image.gz' }}
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup KernelSU-Next (manipvlator)
        run: |
          cd "${{ env.KERNEL_DIR }}"
          curl -LSs "https://raw.githubusercontent.com/manipvlator/KernelSU/refs/heads/main/kernel/setup.sh" | bash -s main
          # Verify setup
          ls -ld drivers/kernelsu
      - name: Cache Neutron Clang
        id: cache-neutron
        uses: actions/cache@v4
        with:
          path: ${{ env.NEUTRON_DIR }}
          key: neutron-clang-latest-v1
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            libncurses5-dev \
            libncurses5 \
            libtinfo5 \
            zlib1g-dev \
            lz4 \
            gzip \
            zip \
            tar \
            curl \
            cpio \
            rsync \
            kmod \
            python3 \
            python-is-python3 \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi

      - name: Setup Neutron Clang
        if: steps.cache-neutron.outputs.cache-hit != 'true'
        run: |
          mkdir -p "${{ env.NEUTRON_DIR }}"
          cd "${{ env.NEUTRON_DIR }}"
          curl -LO "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman"
          chmod +x antman
          ./antman --sync=latest
          ./antman --patch=glibc || true
      - name: Prepare Output Directory
        run: |
          mkdir -p "${{ env.OUT_DIR }}"

      - name: Fix Kernel Script Permissions
        run: |
          find "${{ env.KERNEL_DIR }}/scripts" -name "*.sh" -exec chmod +x {} \;
          echo "Script permissions fixed."

      - name: Configure Kernel (${{ env.DEFCONFIG }})
        run: |
          set -o pipefail
          export PATH="${{ env.NEUTRON_DIR }}/bin:$PATH"
          make -C "${{ env.KERNEL_DIR }}" O="${{ env.OUT_DIR }}" \
            ARCH=arm64 \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            V=1 \
            "${{ env.DEFCONFIG }}" 2>&1 | tee "${{ github.workspace }}/config.log" || {
              echo "::error::KCONFIG PARSE FAILED - SEE CONFIG.LOG FOR DETAILS" >&2
              exit 1
            }

      - name: Upload Configure Log On Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-config-failure-log
          path: ${{ github.workspace }}/config.log
          if-no-files-found: warn


      - name: Build Kernel Image
        run: |
          set -o pipefail
          export PATH="${{ env.NEUTRON_DIR }}/bin:$PATH"
          make -C "${{ env.KERNEL_DIR }}" O="${{ env.OUT_DIR }}" \
            -j$(nproc) \
            ARCH=arm64 \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            ${{ env.BUILD_TARGET }} 2>&1 | tee "${{ github.workspace }}/build.log"

      - name: Upload Build Log On Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-failure-log
          path: ${{ github.workspace }}/build.log
          if-no-files-found: warn
      - name: Validate Output Artifacts and Version
        run: |
          echo "=== Verification ==="
          if [ ! -s "${{ env.OUT_DIR }}/arch/arm64/boot/Image" ]; then
            echo "::error::Image file missing or empty!"
            exit 1
          fi
          ls -lh "${{ env.OUT_DIR }}/arch/arm64/boot/Image"

          if [ -f "${{ env.OUT_DIR }}/arch/arm64/boot/Image.gz" ]; then
            ls -lh "${{ env.OUT_DIR }}/arch/arm64/boot/Image.gz"
          fi

          if [ ! -f "${{ env.OUT_DIR }}/include/config/kernel.release" ]; then
            echo "::error::include/config/kernel.release missing!"
            exit 1
          fi

          KERNELRELEASE=$(cat "${{ env.OUT_DIR }}/include/config/kernel.release")
          echo "KERNELRELEASE: $KERNELRELEASE"
          echo "KERNELRELEASE=$KERNELRELEASE" >> $GITHUB_ENV

          if [[ "$KERNELRELEASE" =~ -dirty$ ]]; then
            echo "::error::Kernel release contains -dirty suffix: $KERNELRELEASE"
            exit 1
          fi

          EXPECTED="5.4.161-NevaCPS-12-9-gb17cbc51204f-tempest"
          if [ "$KERNELRELEASE" != "$EXPECTED" ]; then
            echo "::warning::Release ($KERNELRELEASE) differs from target ($EXPECTED)"
          else
            echo "Release exactly matches target: $EXPECTED"
          fi

      - name: Package Build Artifacts
        run: |
          mkdir -p "${{ github.workspace }}/artifacts"
          cp "${{ env.OUT_DIR }}/arch/arm64/boot/Image" "${{ github.workspace }}/artifacts/"
          if [ -f "${{ env.OUT_DIR }}/arch/arm64/boot/Image.gz" ]; then
            cp "${{ env.OUT_DIR }}/arch/arm64/boot/Image.gz" "${{ github.workspace }}/artifacts/"
          fi
          cp "${{ env.OUT_DIR }}/.config" "${{ github.workspace }}/artifacts/kernel.config"
          cp "${{ env.OUT_DIR }}/include/config/kernel.release" "${{ github.workspace }}/artifacts/kernel.release"
          cp "${{ github.workspace }}/build.log" "${{ github.workspace }}/artifacts/build.log"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ env.KERNELRELEASE || 'arm64' }}
          path: ${{ github.workspace }}/artifacts/
          if-no-files-found: error
