name: Build Android Kernel ARM64

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: 'Kernel Defconfig'
        required: true
        default: 'sprd_qogirl6_defconfig'
        type: choice
        options:
          - sprd_qogirl6_defconfig
          - sprd_sharkl5Pro_defconfig
      build_target:
        description: 'Target to build (e.g. Image, Image.gz)'
        required: false
        default: 'Image Image.gz'
        type: string
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'README.md'
      - '.gitignore'
      - 'docs/**'
jobs:
  build:
    name: Build Kernel ARM64
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    env:
      ARCH: arm64
      KBUILD_BUILD_USER: NevaCPS
      KBUILD_BUILD_HOST: GitHubActions
      KERNEL_DIR: bsp/kernel/kernel5.4
      OUT_DIR: ${{ github.workspace }}/out
      NEUTRON_DIR: ${{ github.workspace }}/toolchain/neutron-clang
      DEFCONFIG: ${{ inputs.defconfig || 'sprd_qogirl6_defconfig' }}
      BUILD_TARGET: ${{ inputs.build_target || 'Image Image.gz' }}
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup ReSukiSU
        run: |
          cd "${{ env.KERNEL_DIR }}"
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -s main
          ls -ld drivers/kernelsu || true
      - name: Cache Toolchains
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.NEUTRON_DIR }}
            ${{ github.workspace }}/toolchain/gcc64
            ${{ github.workspace }}/toolchain/gcc32
          key: toolchain-neutron-30072026-u24-v1
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            libncurses-dev \
            zlib1g-dev \
            lz4 \
            gzip \
            zip \
            tar \
            curl \
            wget \
            cpio \
            rsync \
            kmod \
            python3 \
            python-is-python3 \
            dos2unix

      - name: Download Neutron-Clang Toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          mkdir -p "${{ env.NEUTRON_DIR }}"
          cd "${{ env.NEUTRON_DIR }}"
          wget https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/30072026/neutron-clang-30072026.tar.zst
          tar -xf neutron-clang-30072026.tar.zst
          rm -rf neutron-clang-30072026.tar.zst
          cd "${{ github.workspace }}/toolchain"
          if [ ! -d "gcc64" ]; then
            git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git gcc64
          fi
          if [ ! -d "gcc32" ]; then
            git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git gcc32
          fi
      - name: Prepare Output Directory
        run: |
          mkdir -p "${{ env.OUT_DIR }}"

      - name: Fix Kernel Script Permissions
        run: |
          find "${{ env.KERNEL_DIR }}" -name "*.sh" -exec chmod +x {} \;
          echo "All script permissions fixed."

      - name: Configure Kernel (${{ env.DEFCONFIG }})
        run: |
          set -o pipefail
          export PATH="${{ env.NEUTRON_DIR }}/bin:${{ github.workspace }}/toolchain/gcc64/bin:${{ github.workspace }}/toolchain/gcc32/bin:$PATH"
          export HOSTCC=/usr/bin/gcc
          export HOSTCXX=/usr/bin/g++
          make -C "${{ env.KERNEL_DIR }}" O="${{ env.OUT_DIR }}" \
            ARCH=arm64 \
            HOSTCC=/usr/bin/gcc \
            HOSTCXX=/usr/bin/g++ \
            HOSTLD=/usr/bin/ld \
            HOSTAR=/usr/bin/ar \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_COMPAT=arm-linux-androideabi- \
            "${{ env.DEFCONFIG }}" 2>&1 | tee "${{ github.workspace }}/config.log" || {
              echo "::error::KCONFIG PARSE FAILED - SEE CONFIG.LOG FOR DETAILS" >&2
              exit 1
            }

      - name: Upload Configure Log On Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-config-failure-log
          path: ${{ github.workspace }}/config.log
          if-no-files-found: warn

      - name: Build Kernel Image
        run: |
          set -o pipefail
          export PATH="${{ env.NEUTRON_DIR }}/bin:${{ github.workspace }}/toolchain/gcc64/bin:${{ github.workspace }}/toolchain/gcc32/bin:$PATH"
          export HOSTCC=/usr/bin/gcc
          export HOSTCXX=/usr/bin/g++
          make -C "${{ env.KERNEL_DIR }}" O="${{ env.OUT_DIR }}" \
            -j$(nproc --all) \
            ARCH=arm64 \
            HOSTCC=/usr/bin/gcc \
            HOSTCXX=/usr/bin/g++ \
            HOSTLD=/usr/bin/ld \
            HOSTAR=/usr/bin/ar \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_COMPAT=arm-linux-androideabi- \
            ${{ env.BUILD_TARGET }} 2>&1 | tee "${{ github.workspace }}/build.log"
      - name: Print Build Error Tail
        if: failure()
        run: |
          echo "=== TAIL OF BUILD.LOG (LAST 100 LINES) ==="
          tail -n 100 "${{ github.workspace }}/build.log" || true
          echo "=== SEARCHING FOR ERRORS IN BUILD.LOG ==="
          grep -i -C 3 "error:" "${{ github.workspace }}/build.log" | tail -n 60 || true

      - name: Upload Build Log On Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-failure-log
          path: ${{ github.workspace }}/build.log
          if-no-files-found: warn
      - name: Validate Output Artifacts and Version
        run: |
          echo "=== Verification ==="
          if [ ! -s "${{ env.OUT_DIR }}/arch/arm64/boot/Image" ]; then
            echo "::error::Image file missing or empty!"
            exit 1
          fi
          ls -lh "${{ env.OUT_DIR }}/arch/arm64/boot/Image"

          if [ -f "${{ env.OUT_DIR }}/arch/arm64/boot/Image.gz" ]; then
            ls -lh "${{ env.OUT_DIR }}/arch/arm64/boot/Image.gz"
          fi

          if [ ! -f "${{ env.OUT_DIR }}/include/config/kernel.release" ]; then
            echo "::error::include/config/kernel.release missing!"
            exit 1
          fi

          KERNELRELEASE=$(cat "${{ env.OUT_DIR }}/include/config/kernel.release")
          echo "KERNELRELEASE: $KERNELRELEASE"
          echo "KERNELRELEASE=$KERNELRELEASE" >> $GITHUB_ENV

          EXPECTED="5.4.161-NyaNeva-ResukiSU"
          echo "Kernel release built: $KERNELRELEASE (Expected: $EXPECTED)"
      - name: Package Build Artifacts
        run: |
          mkdir -p "${{ github.workspace }}/artifacts"
          cp "${{ env.OUT_DIR }}/arch/arm64/boot/Image" "${{ github.workspace }}/artifacts/"
          if [ -f "${{ env.OUT_DIR }}/arch/arm64/boot/Image.gz" ]; then
            cp "${{ env.OUT_DIR }}/arch/arm64/boot/Image.gz" "${{ github.workspace }}/artifacts/"
          fi
          cp "${{ env.OUT_DIR }}/.config" "${{ github.workspace }}/artifacts/kernel.config"
          cp "${{ env.OUT_DIR }}/include/config/kernel.release" "${{ github.workspace }}/artifacts/kernel.release"
          cp "${{ github.workspace }}/build.log" "${{ github.workspace }}/artifacts/build.log"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ env.KERNELRELEASE || 'arm64' }}
          path: ${{ github.workspace }}/artifacts/
          if-no-files-found: error
